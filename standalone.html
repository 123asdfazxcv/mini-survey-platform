<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>迷你模拟消费者调研平台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ===== 5 Warm Themes ===== */
body[data-theme="apricot"]{--bg:#fdf8f3;--bg-soft:#faf4ed;--bg-card:#fff;--text-primary:#3e3230;--text-secondary:#6b5d58;--text-muted:#a3968e;--accent:#d4956a;--accent-strong:#c1784a;--accent-soft:#f0d5c0;--accent-dim:#e8c4a8;--border:#ece0d5;--border-light:#f5ede5;--stat-bg:#fdf6f0;--input-bg:#fdf8f4;--input-border:#e8dbcf;--tag-bg:#fdf6f0;--tag-border:#f0d5c0;--shadow:0 1px 3px rgba(80,40,20,.04),0 4px 16px rgba(80,40,20,.04);--shadow-hover:0 1px 3px rgba(80,40,20,.06),0 6px 24px rgba(80,40,20,.06)}
body[data-theme="peach"]{--bg:#fef5f5;--bg-soft:#fdf0f0;--bg-card:#fff;--text-primary:#3d2e33;--text-secondary:#6b555b;--text-muted:#a38b90;--accent:#d4857b;--accent-strong:#c1706a;--accent-soft:#f2ceca;--accent-dim:#eabfb8;--border:#f0dedb;--border-light:#f8edeb;--stat-bg:#fef7f6;--input-bg:#fef8f7;--input-border:#edd5d2;--tag-bg:#fef7f6;--tag-border:#f2ceca;--shadow:0 1px 3px rgba(80,30,30,.04),0 4px 16px rgba(80,30,30,.04);--shadow-hover:0 1px 3px rgba(80,30,30,.06),0 6px 24px rgba(80,30,30,.06)}
body[data-theme="oat"]{--bg:#f9f6f1;--bg-soft:#f5f1ea;--bg-card:#fff;--text-primary:#3d3832;--text-secondary:#6b6359;--text-muted:#a3988c;--accent:#c4a882;--accent-strong:#af8f65;--accent-soft:#e8daca;--accent-dim:#dfceb8;--border:#e8e0d4;--border-light:#f2ece4;--stat-bg:#faf7f2;--input-bg:#faf7f3;--input-border:#e5dbcc;--tag-bg:#faf7f2;--tag-border:#e8daca;--shadow:0 1px 3px rgba(60,40,20,.04),0 4px 16px rgba(60,40,20,.04);--shadow-hover:0 1px 3px rgba(60,40,20,.06),0 6px 24px rgba(60,40,20,.06)}
body[data-theme="amber"]{--bg:#fdf7ef;--bg-soft:#faf2e6;--bg-card:#fff;--text-primary:#3e3328;--text-secondary:#6b5a48;--text-muted:#a3927c;--accent:#d4a35a;--accent-strong:#c18e3e;--accent-soft:#f0dbb8;--accent-dim:#e8cfa0;--border:#ece0c8;--border-light:#f5eddc;--stat-bg:#fdf8f1;--input-bg:#fdf9f2;--input-border:#e8dcc8;--tag-bg:#fdf8f1;--tag-border:#f0dbb8;--shadow:0 1px 3px rgba(80,50,10,.04),0 4px 16px rgba(80,50,10,.04);--shadow-hover:0 1px 3px rgba(80,50,10,.06),0 6px 24px rgba(80,50,10,.06)}
body[data-theme="rose"]{--bg:#faf4f3;--bg-soft:#f6eeed;--bg-card:#fff;--text-primary:#3d2f30;--text-secondary:#6b5456;--text-muted:#a38a8b;--accent:#c0847c;--accent-strong:#ad6b63;--accent-soft:#ebceca;--accent-dim:#e2bdb8;--border:#eedad7;--border-light:#f6eae8;--stat-bg:#fbf5f4;--input-bg:#fbf6f5;--input-border:#ebd6d3;--tag-bg:#fbf5f4;--tag-border:#ebceca;--shadow:0 1px 3px rgba(80,30,30,.04),0 4px 16px rgba(80,30,30,.04);--shadow-hover:0 1px 3px rgba(80,30,30,.06),0 6px 24px rgba(80,30,30,.06)}

body {
  --bg:#fdf8f3;--bg-soft:#faf4ed;--bg-card:#fff;--text-primary:#3e3230;--text-secondary:#6b5d58;--text-muted:#a3968e;--accent:#d4956a;--accent-strong:#c1784a;--accent-soft:#f0d5c0;--accent-dim:#e8c4a8;--border:#ece0d5;--border-light:#f5ede5;--stat-bg:#fdf6f0;--input-bg:#fdf8f4;--input-border:#e8dbcf;--tag-bg:#fdf6f0;--tag-border:#f0d5c0;--shadow:0 1px 3px rgba(80,40,20,.04),0 4px 16px rgba(80,40,20,.04);--shadow-hover:0 1px 3px rgba(80,40,20,.06),0 6px 24px rgba(80,40,20,.06);
  --radius-sm:8px;--radius:14px;--radius-lg:20px;--transition:0.25s cubic-bezier(0.4,0,0.2,1);
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);min-height:100vh;color:var(--text-primary);
  -webkit-font-smoothing:antialiased;line-height:1.6;
  transition:background var(--transition),color var(--transition);
}

.container{max-width:680px;margin:0 auto;padding:32px 24px 56px;position:relative;z-index:1}

/* Theme Switcher */
.theme-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0 12px}
.theme-bar-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase;margin-right:4px}
.theme-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all var(--transition);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.theme-dot:hover{transform:scale(1.15)}
.theme-dot.active{border-color:var(--text-primary);box-shadow:0 0 0 3px var(--border)}
.theme-dot[data-theme="apricot"]{background:linear-gradient(135deg,#fdf8f3,#e8c4a8)}
.theme-dot[data-theme="peach"]{background:linear-gradient(135deg,#fef5f5,#eabfb8)}
.theme-dot[data-theme="oat"]{background:linear-gradient(135deg,#f9f6f1,#dfceb8)}
.theme-dot[data-theme="amber"]{background:linear-gradient(135deg,#fdf7ef,#e8cfa0)}
.theme-dot[data-theme="rose"]{background:linear-gradient(135deg,#faf4f3,#e2bdb8)}

/* API Key */
.api-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 0 12px;flex-wrap:wrap}
.api-bar input{padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;width:280px;background:var(--input-bg);color:var(--text-primary);outline:none;font-family:inherit}
.api-bar input:focus{border-color:var(--accent)}
.api-badge{font-size:10px;font-weight:600;padding:3px 10px;border-radius:100px}
.api-badge.on{background:#e8f5e9;color:#2e7d32}
.api-badge.off{background:#fff3e0;color:#e65100}

/* Persona Switcher */
.persona-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:2px 0 16px;flex-wrap:wrap}
.persona-bar-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin-right:4px}
.persona-cards{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.persona-card-mini{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:100px;cursor:pointer;background:var(--bg-card);border:1px solid var(--border);transition:all var(--transition);user-select:none}
.persona-card-mini:hover{border-color:var(--accent-dim);transform:translateY(-1px);box-shadow:var(--shadow)}
.persona-card-mini.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow)}
.persona-card-avatar{font-size:18px;line-height:1}
.persona-card-name{font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap}

/* Hero */
.hero{text-align:center;padding:36px 0 32px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-strong);padding:5px 14px;border:1px solid var(--accent-soft);border-radius:100px;margin-bottom:26px}
.hero-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent-strong)}
.hero-avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--accent-soft),var(--bg-soft));border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:46px;margin:0 auto 18px;box-shadow:var(--shadow)}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-0.5px;color:var(--text-primary);line-height:1.2}
.hero .meta{font-size:14px;color:var(--text-secondary);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:14px}
.hero .meta .sep{color:var(--text-muted);font-weight:300}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);margin:24px 0 0;border-radius:var(--radius);background:var(--stat-bg);border:1px solid var(--border-light);overflow:hidden}
.stat-item{text-align:center;padding:16px 8px}
.stat-value{font-size:20px;font-weight:700;color:var(--accent-strong);letter-spacing:-0.3px}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:500;letter-spacing:.04em}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.tag{font-size:12px;padding:5px 13px;border-radius:100px;background:var(--tag-bg);border:1px solid var(--tag-border);color:var(--text-secondary);transition:all var(--transition);font-weight:500}

/* Cards */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow);margin-bottom:14px;transition:box-shadow var(--transition)}
.card:hover{box-shadow:var(--shadow-hover)}
.card-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-label::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--accent)}

/* Input */
.input-group{display:flex;gap:10px}
.input-group input{flex:1;padding:13px 18px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius);font-size:15px;color:var(--text-primary);outline:none;transition:all var(--transition);font-family:inherit}
.input-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input-group input::placeholder{color:var(--text-muted)}
.input-group input.error{border-color:#d97070;box-shadow:0 0 0 3px rgba(217,112,112,.12)}
.btn{padding:13px 30px;background:var(--accent-strong);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:all var(--transition);white-space:nowrap;font-family:inherit}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.btn:active{transform:translateY(0);filter:brightness(.95)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}

.quick-section{margin-top:14px}
.quick-label{font-size:11px;color:var(--text-muted);font-weight:500;margin-bottom:8px;letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13px;padding:6px 15px;border-radius:100px;background:var(--tag-bg);border:1px solid var(--tag-border);color:var(--text-secondary);cursor:pointer;transition:all var(--transition);white-space:nowrap;font-weight:500}
.chip:hover{background:var(--accent-soft);border-color:var(--accent-dim);color:var(--accent-strong)}

/* Conversation */
.conv-thread{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.msg-pair{animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-q{background:var(--bg-soft);border:1px solid var(--border-light);border-radius:var(--radius-lg) var(--radius-lg) var(--radius-sm) var(--radius-lg);padding:13px 18px;font-size:14px;color:var(--text-secondary);font-weight:500;margin-bottom:8px;position:relative}
.msg-q::before{content:'Q';position:absolute;top:-8px;left:14px;font-size:10px;font-weight:700;color:var(--accent-strong);background:var(--bg-card);padding:0 6px;letter-spacing:.06em}
.msg-a{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) var(--radius-lg) var(--radius-sm);padding:16px 18px;font-size:15px;line-height:1.85;color:var(--text-primary);position:relative}
.msg-a::before{content:'A';position:absolute;top:-8px;left:14px;font-size:10px;font-weight:700;color:var(--accent);background:var(--bg-card);padding:0 6px;letter-spacing:.06em}

/* Sentiment */
.sentiment-badge{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:100px;margin-top:8px}
.sentiment-badge.s-种草{background:#e8f5e9;color:#2e7d32}
.sentiment-badge.s-中立{background:#f5f5f5;color:#616161}
.sentiment-badge.s-吐槽{background:#fce4ec;color:#c62828}

/* Follow-ups */
.fu-section{margin-top:10px}
.fu-label{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase}
.fu-chips{display:flex;flex-wrap:wrap;gap:6px}
.fu-chip{font-size:12px;padding:6px 14px;border-radius:100px;cursor:pointer;background:var(--accent-soft);border:1px solid var(--accent-dim);color:var(--accent-strong);font-weight:500;transition:all var(--transition);white-space:nowrap}
.fu-chip:hover{background:var(--accent-dim);border-color:var(--accent-strong)}

/* Tracker */
.tracker-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-top:4px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tracker-title{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase}
.tracker-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;flex:1;min-width:120px;background:#eee}
.tracker-seg{transition:width .4s ease}
.tracker-seg.pos{background:#66bb6a}
.tracker-seg.neu{background:#bdbdbd}
.tracker-seg.neg{background:#ef5350}
.tracker-count{font-size:11px;color:var(--text-muted);font-weight:500}

/* Scenarios */
.scenario-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.scenario-card{font-size:12px;padding:11px 14px;cursor:pointer;border-radius:var(--radius);background:var(--bg-card);border:1px dashed var(--accent-dim);color:var(--text-secondary);transition:all var(--transition);line-height:1.5;text-align:left}
.scenario-card:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.scenario-card .sc-emoji{font-size:16px;margin-right:4px}

.btn-clear{font-size:11px;padding:6px 14px;border-radius:100px;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--text-muted);transition:all var(--transition);font-family:inherit;font-weight:500;margin-left:auto}
.btn-clear:hover{border-color:#d97070;color:#d97070;background:rgba(217,112,112,.04)}

.loading-ring{display:flex;align-items:center;justify-content:center;padding:28px 0}
.loading-ring .ring{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.diag-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius);padding:16px 20px;margin-top:14px;box-shadow:var(--shadow)}
.diag-card summary{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--text-muted);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
.diag-card summary::-webkit-details-marker{display:none}
.diag-card summary::after{content:'展开';font-size:10px;color:var(--accent-dim);margin-left:auto;font-weight:500}
.diag-card details[open] summary::after{content:'收起'}
.diag-list{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.diag-item{font-size:13px;padding:10px 14px;background:var(--bg-soft);border-radius:var(--radius-sm);color:var(--text-secondary);line-height:1.65}
.diag-item strong{color:var(--accent-strong);font-weight:600}
.diag-item code{color:var(--accent-strong);background:var(--accent-soft);padding:1px 5px;border-radius:3px;font-size:12px}
.diag-note{font-size:12px;color:var(--text-muted);margin-top:10px;line-height:1.6}
.diag-note code{color:var(--accent-dim);background:var(--accent-soft);padding:1px 5px;border-radius:3px}
.footer{text-align:center;padding:32px 0 0;font-size:11px;color:var(--text-muted);letter-spacing:.04em;font-weight:500}

@media(max-width:560px){.container{padding:20px 16px 40px}.input-group{flex-direction:column}.btn{width:100%;text-align:center}.hero h1{font-size:26px}.hero-avatar{width:80px;height:80px;font-size:38px}.scenario-grid{grid-template-columns:1fr}}
</style>
</head>

<div class="container">
  <!-- Theme -->
  <div class="theme-bar">
    <span class="theme-bar-label">Theme</span>
    <span class="theme-dot active" data-theme="apricot" data-label="暖杏" onclick="setTheme('apricot')"></span>

    <span class="theme-dot" data-theme="oat" data-label="燕麦" onclick="setTheme('oat')"></span>
    <span class="theme-dot" data-theme="amber" data-label="琥珀" onclick="setTheme('amber')"></span>
    <span class="theme-dot" data-theme="rose" data-label="玫瑰" onclick="setTheme('rose')"></span>
  </div>

  <!-- API mode / Backend status -->

  <!-- Persona -->
  <div class="persona-bar" id="personaBar"></div>

  <!-- Hero -->
  <div class="hero">

    <div class="meta" id="heroMeta"></div>
    <div class="stat-row" id="heroStats"></div>
    <div class="tag-row" id="heroTags"></div>
  </div>

  <!-- Scenarios -->
  <div id="scenarioSection">

    <div class="quick-section">
      <div class="quick-label">Quick Prompts</div>
      <div class="chips" id="quickChips"></div>

  <!-- Tracker -->
  <div class="tracker-card" id="trackerCard" style="display:none">
    <span class="tracker-title">Sentiment</span>
    <div class="tracker-bar" id="trackerBar"><div class="tracker-seg neu" style="width:100%"></div></div>
    <span class="tracker-count" id="trackerCount">0 answers</span>
  </div>

  <div class="diag-card">
    <details>
      <summary>Test Cases &amp; Diagnostics</summary>
      <div class="diag-list">
        <div class="diag-item"><strong>对话流</strong> — 连续问3个问题，验证追问按钮生成和情感累积</div>
        <div class="diag-item"><strong>场景测试</strong> — 点击 What-If 场景卡，测试"如果...会怎样"回答</div>
        <div class="diag-item"><strong>情感追踪</strong> — 底部追踪条实时更新，显示 😊/😐/😠 比例</div>
      </div>
    </details>
  </div>

  <div class="footer">Mini Consumer Survey Platform — Standalone v1</div>
</div>

var DEFAULT_PERSONA = 'xiaolin';
var currentPersonaId = DEFAULT_PERSONA;
var conversation = [];
var sentimentHistory = [];
var API_KEY = '';
var useApi = false;

// ===== THEME =====
function setTheme(name){
  document.body.setAttribute('data-theme',name);
  localStorage.setItem('survey-theme',name);
  document.querySelectorAll('.theme-dot').forEach(function(d){d.classList.toggle('active',d.getAttribute('data-theme')===name)});
}
(function(){var s=localStorage.getItem('survey-theme');if(s)setTheme(s)})();

// ===== API KEY =====
var apiBackend = 'mock';
function onApiKeyChange(){
  API_KEY = document.getElementById('apiKeyInput').value.trim();
  checkBackend();
}
async function checkBackend() {
  var badge = document.getElementById('apiBadge');
  // 先检测代理
  try {
    var resp = await fetch('http://localhost:3001/api/status');
    var info = await resp.json();
    apiBackend = info.backend || 'proxy';
    useApi = true;
    badge.textContent = apiBackend === 'ollama' ? 'Ollama 本地' : apiBackend === 'deepseek' ? 'DeepSeek' : 'Claude API';
    badge.className = 'api-badge on';
    return;
  } catch(e) {}
  // 无代理，检查直连 Key
  if (API_KEY) {
    useApi = true;
    apiBackend = 'direct';
    badge.textContent = 'API 直连';
    badge.className = 'api-badge on';
    return;
  }
  // 无 Key 无代理 → Mock
  useApi = false;
  apiBackend = 'mock';
  badge.textContent = 'Mock';
  badge.className = 'api-badge off';
}
// 页面加载后自动检测
setTimeout(checkBackend, 500);

// ===== PERSONA =====
function switchPersona(id){
  currentPersonaId=id;localStorage.setItem('survey-persona',id);
  renderPersonaBar();renderHero();renderQuickPrompts();renderScenarios();
}
function renderPersonaBar(){
  var bar=document.getElementById('personaBar');
  var h='<span class="persona-bar-label">Persona</span><div class="persona-cards">';
  for(var pid in PERSONAS){var p=PERSONAS[pid];var a=pid===currentPersonaId?' active':'';
    h+='<div class="persona-card-mini'+a+'" onclick="switchPersona(\''+pid+'\')"><span class="persona-card-avatar">'+p.avatar+'</span><span class="persona-card-name">'+p.name+'</span></div>';}
  h+='</div>';bar.innerHTML=h;
}
function renderHero(){
  var p=PERSONAS[currentPersonaId];
  document.getElementById('heroAvatar').innerHTML=p.avatar;
  document.getElementById('heroName').textContent=p.name;
  document.getElementById('heroMeta').innerHTML='<span>'+p.age+'</span><span class="sep">|</span><span>'+p.city+'</span><span class="sep">|</span><span>'+p.job+'</span>';
  var sh='';p.stats.forEach(function(s){sh+='<div class="stat-item"><div class="stat-value">'+s.value+'</div><div class="stat-label">'+s.label+'</div></div>'});document.getElementById('heroStats').innerHTML=sh;
  var th='';p.tags.forEach(function(t){th+='<span class="tag">'+t+'</span>'});document.getElementById('heroTags').innerHTML=th;
}
function renderQuickPrompts(){
  var p=PERSONAS[currentPersonaId];var h='';
  p.quick_prompts.forEach(function(qp){h+='<span class="chip" onclick="setQuestion(\''+qp[0].replace(/'/g,"\\'")+'\')">'+qp[1]+'</span>'});
  document.getElementById('quickChips').innerHTML=h;
}
function renderScenarios(){
  var p=PERSONAS[currentPersonaId];
  var s=p.scenarios||[];var section=document.getElementById('scenarioSection');
  if(!s.length){section.style.display='none';return}
  section.style.display='block';

  document.getElementById('scenarioGrid').innerHTML=h;
}

// ===== SENTIMENT CLASSIFIER =====
var POS_WORDS=["喜欢","好用","推荐","值得","满意","划算","实惠","方便","开心","舒服","不错","好 ","爱 ","便宜","超值","棒","囤","回购","种草","必买","值了","绝了","性价比高","最爱","必要","重要","愿意","花得值","提升","享受"];
var NEG_WORDS=["贵","差","坑","后悔","不好","不行","失望","浪费","太贵","不值","踩雷","垃圾","骗","心疼","下不去手","买不起","消费不起","不划算","不推荐","踩坑","智商税","割韭菜","不好用","烂","差评"];
function classifySentiment(text){
  var pos=0,neg=0;POS_WORDS.forEach(function(w){if(text.indexOf(w)>=0)pos++});NEG_WORDS.forEach(function(w){if(text.indexOf(w)>=0)neg++});
  if(pos>neg+1)return'种草';if(neg>pos+1)return'吐槽';return'中立';
}

// ===== MOCK ANSWER =====
function mockAnswer(question,personaId){
  var p=PERSONAS[personaId]||PERSONAS[DEFAULT_PERSONA];var q=question.toLowerCase();var answer=p.fallback;
  for(var i=0;i<(p.mock||[]).length;i++){for(var j=0;j<p.mock[i].keywords.length;j++){if(q.indexOf(p.mock[i].keywords[j].toLowerCase())>=0){answer=p.mock[i].answer;break}}if(answer!==p.fallback)break}
  var sentiment=classifySentiment(answer);
  var followUps=[];
  (p.quick_prompts||[]).forEach(function(qp){if(qp[0]!==question)followUps.push({text:qp[0],label:qp[1]})});
  return{answer:answer,sentiment:sentiment,follow_ups:followUps.slice(0,3)};
}

// ===== API CALL (proxy auto-detects backend) =====
var API_BASE = 'http://localhost:3001/api/chat';
async function apiAnswer(question,personaId){
  var p=PERSONAS[personaId]||PERSONAS[DEFAULT_PERSONA];
  var prompt=p.system_prompt+'\n\n请在回答后附加：[情感]种草/中立/吐槽（三选一）\n[追问1]一个相关的追问\n[追问2]另一个相关的追问';
  var body={model:'claude-sonnet-4-6',max_tokens:500,temperature:0.8,system:prompt,
    messages:[{role:'user',content:'调研问题：'+question+'\n\n请以这个消费者的身份，用第一人称自然回答。'}]};

  // 先尝试代理
  var resp=await fetch(API_BASE,{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(!resp.ok) throw new Error('Proxy error: '+resp.status);
  var data=await resp.json();

  // 兼容多种响应格式
  var raw;
  if(data.content) raw = data.content[0].text;           // Anthropic 格式
  else if(data.response) raw = data.response;             // Ollama 格式
  else if(data.choices) raw = data.choices[0].message.content; // OpenAI/DeepSeek 格式
  else throw new Error('Unknown response format');
  var raw=data.content[0].text;
  var sentiment='中立',followUps=[],answer=raw;
  raw.split('\n').forEach(function(line){line=line.trim();
    if(line.startsWith('[情感]')||line.startsWith('情感：')){var s=line.replace('[情感]','').replace('情感：','').trim();if(s.indexOf('种草')>=0)sentiment='种草';else if(s.indexOf('吐槽')>=0)sentiment='吐槽'}
    else if(line.startsWith('[追问1]')||line.startsWith('1.')){var fu=line.split(']')[1]||'';if(fu.trim())followUps.push({text:fu.trim(),label:fu.trim()})}
    else if(line.startsWith('[追问2]')||line.startsWith('2.')){var fu=line.split(']')[1]||'';if(fu.trim())followUps.push({text:fu.trim(),label:fu.trim()})}
  });
  var clean=raw.split('\n').filter(function(l){var t=l.trim();return!t.startsWith('[情感]')&&!t.startsWith('情感：')&&!t.startsWith('[追问')&&!t.startsWith('1.')&&!t.startsWith('2.')}).join('\n').trim();
  if(!followUps.length){var p=PERSONAS[personaId]||PERSONAS[DEFAULT_PERSONA];(p.quick_prompts||[]).forEach(function(qp){if(qp[0]!==question)followUps.push({text:qp[0],label:qp[1]})});followUps=followUps.slice(0,3)}
  return{answer:clean||raw,sentiment:sentiment,follow_ups:followUps};
}

// ===== CONVERSATION =====
function renderConversation(){
  var thread=document.getElementById('convThread'),clearBtn=document.getElementById('btnClear');
  if(!conversation.length){thread.innerHTML='';clearBtn.style.display='none';return}
  clearBtn.style.display='inline-block';var h='';
  conversation.forEach(function(pair){
    h+='<div class="msg-pair"><div class="msg-q">'+esc(pair.q)+'</div><div class="msg-a">'+esc(pair.a);
    h+='<div class="sentiment-badge s-'+pair.sentiment+'">'+(pair.sentiment==='种草'?'😊 ':pair.sentiment==='吐槽'?'😠 ':'😐 ')+pair.sentiment+'</div>';
    if(pair.follow_ups&&pair.follow_ups.length){
      h+='<div class="fu-section"><div class="fu-label">Smart Follow-up</div><div class="fu-chips">';
      pair.follow_ups.forEach(function(fu){var label=fu.label||fu.text||(Array.isArray(fu)?fu[1]:'')||fu||'',text=fu.text||(Array.isArray(fu)?fu[0]:'')||fu||'';if(typeof text==='string'&&text)h+='<span class="fu-chip" onclick="setQuestion(\''+text.replace(/'/g,"\\'")+'\');submitQuestion()">'+label+'</span>'});
      h+='</div></div>';
    }
    h+='</div></div>';
  });
  thread.innerHTML=h;thread.scrollTop=thread.scrollHeight;
}
function renderTracker(){
  var card=document.getElementById('trackerCard'),bar=document.getElementById('trackerBar'),ce=document.getElementById('trackerCount');
  if(!sentimentHistory.length){card.style.display='none';return}card.style.display='flex';
  var pos=0,neu=0,neg=0;sentimentHistory.forEach(function(s){if(s==='种草')pos++;else if(s==='吐槽')neg++;else neu++});
  var t=sentimentHistory.length,pPct=Math.round(pos/t*100),nPct=Math.round(neu/t*100),gPct=100-pPct-nPct;
  bar.innerHTML='<div class="tracker-seg pos" style="width:'+pPct+'%"></div><div class="tracker-seg neu" style="width:'+nPct+'%"></div><div class="tracker-seg neg" style="width:'+gPct+'%"></div>';
  ce.textContent=t+' answers · '+pPct+'% 😊 '+nPct+'% 😐 '+gPct+'% 😠';
}
function clearConversation(){conversation=[];sentimentHistory=[];renderConversation();renderTracker()}
function esc(str){var d=document.createElement('div');d.textContent=str;return d.innerHTML}

// ===== SURVEY =====
var questionInput=document.getElementById('question'),submitBtn=document.getElementById('submitBtn'),btnLabel=document.getElementById('btnLabel'),loading=false;
window.setQuestion=function(text){questionInput.value=text;questionInput.focus()};
questionInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!loading)submitQuestion()});

async function submitQuestion(){
  var question=questionInput.value.trim();
  if(!question){questionInput.classList.add('error');setTimeout(function(){questionInput.classList.remove('error')},1500);return}
  if(loading)return;
  loading=true;submitBtn.disabled=true;btnLabel.textContent='生成中...';
  try{
    var result=useApi?await apiAnswer(question,currentPersonaId):mockAnswer(question,currentPersonaId);
    conversation.push({q:question,a:result.answer,sentiment:result.sentiment,follow_ups:result.follow_ups});
    sentimentHistory.push(result.sentiment);questionInput.value='';
  }catch(e){
    conversation.push({q:question,a:'请求失败: '+e.message,sentiment:'中立',follow_ups:[]});sentimentHistory.push('中立');
  }
  renderConversation();renderTracker();loading=false;submitBtn.disabled=false;btnLabel.textContent='提交调研';
}

// ===== INIT =====
(function(){
  var sp=localStorage.getItem('survey-persona');if(PERSONAS[sp])currentPersonaId=sp;
  renderPersonaBar();renderHero();renderQuickPrompts();renderScenarios();renderConversation();renderTracker();
})();
